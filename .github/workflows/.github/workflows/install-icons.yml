name: Install app PNG icons
on:
  push:
    paths:
      - '.github/workflows/install-icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore approved PNG assets
        run: |
          mkdir -p icons
          printf %s '' | base64 --decode > icons/icon-192.png
          printf %s '' | base64 --decode > icons/icon-512.png
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add icons/icon-192.png icons/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Restore app PNG icons"
            git push
          fi
